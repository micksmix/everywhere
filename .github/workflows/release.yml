name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(sed -n 's/^VERSION := //p' Makefile)" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build universal app zip
        run: |
          brew install pandoc
          make dist VERSION="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --pattern "Everywhere-$VERSION.zip" --dir existing-release
          else
            gh release create "$GITHUB_REF_NAME" ".build/Everywhere-$VERSION.zip" ".build/Everywhere-$VERSION.zip.sha256" \
              --verify-tag --title "v$VERSION" --generate-notes
          fi

  update-tap:
    needs: release
    runs-on: macos-15
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set the TAP_TOKEN repository secret with Contents: read and write access to micksmix/homebrew-tap."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: micksmix/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update cask from published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "Skipping tap update: $GITHUB_REF_NAME is not the latest release ($latest)."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          asset="Everywhere-$version.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset"
          sha256=$(shasum -a 256 "$RUNNER_TEMP/$asset" | awk '{print $1}')
          sed -i '' -e 's/^  version ".*"/  version "'"$version"'"/' \
                    -e 's/^  sha256 .*/  sha256 "'"$sha256"'"/' Casks/everywhere.rb
          ruby -c Casks/everywhere.rb
          git add Casks/everywhere.rb
          if git diff --cached --quiet; then
            echo "Tap already matches the published release."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "everywhere v$version"
          git push
